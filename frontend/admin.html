<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UServe - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h2>🌟 UServe</h2>
            <nav>
                <button class="nav-btn active" onclick="showPage('approve')">✅ Approve Students</button>
                <button class="nav-btn" onclick="showPage('reports')">📋 Issue Reports</button>
                <button class="nav-btn" onclick="showPage('analytics')">📊 Analytics</button>
            </nav>
            <button onclick="logout()" class="btn-logout">🚪 Logout</button>
        </div>
        <div class="main-content">
            <div id="approvePage" class="page active">
                <h2>Pending Student Approvals</h2>
                <div id="pendingStudents"></div>
            </div>
            <div id="reportsPage" class="page">
                <h2>Issue Reports</h2>
                <div id="issueReportsList"></div>
            </div>
            <div id="analyticsPage" class="page">
                <h2>System Analytics</h2>
                <div id="analyticsData"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
