<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UServe - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌟 UServe</h1>
            <p>Community Service & Volunteerism Platform for UiTM Students</p>
        </div>

        <div id="loginSection" class="section">
            <div class="card">
                <h2>Login to Your Account</h2>
                <div id="loginMessage" class="message" style="display:none;"></div>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                <div class="form-group">
                    <label>Login As</label>
                    <select id="loginRole">
                        <option value="student">Student</option>
                        <option value="organizer">Organizer</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button onclick="login()" class="btn btn-primary">Login</button>
                
                <div class="divider"><span>Don't have an account?</span></div>
                <button onclick="window.location.href='student.html?action=signup'" class="btn btn-secondary">Sign Up as Student</button>

                <div class="demo-info">
                    <p><strong>Demo Accounts:</strong></p>
                    <p>Student: student@userve.com / Student@123</p>
                    <p>Organizer: organizer@userve.com / Org@2024</p>
                    <p>Admin: admin@userve.com / Admin@123</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
